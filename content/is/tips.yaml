    {
      "id": "tip-hello",
      "title": "A hello is enough",
      "severity": "locals-love-it",
      "category": "Greetings",
      "body": "Start with hæ or góðan daginn, then ask your question. You do not need a long introduction at a shop counter.",
      "why": "Keep the exchange friendly and brief.",
      "linkedItem": "p01",
      "sourceIds": [
        "language-course"
      ],
      "reviewedBy": null,
      "question": {
        "prompt": "You approach hotel reception. How do you start?",
        "options": [
          {
            "id": "choice-1",
            "text": "Say hæ, then ask your question."
          },
          {
            "id": "choice-2",
            "text": "Give a speech about your trip."
          },
          {
            "id": "choice-3",
            "text": "Wait for someone to guess your needs."
          }
        ],
        "answerId": "choice-1",
        "feedback": "A short greeting is an easy start."
      }
    },
    {
      "id": "tip-please",
      "title": "Please depends on the request",
      "severity": "good-to-know",
      "category": "Phrases in context",
      "body": "For a short order, takk can do the job of English please: vatn, takk. It also means thanks. Learn the complete request rather than adding a formal please-word to everything.",
      "why": "Politeness comes from the whole request and your tone.",
      "linkedItem": "p04",
      "sourceIds": [
        "language-course"
      ],
      "reviewedBy": null,
      "question": {
        "prompt": "You want water at a café. What fits?",
        "options": [
          {
            "id": "choice-1",
            "text": "Repeat please in English louder."
          },
          {
            "id": "choice-2",
            "text": "Use the complete water request with takk."
          },
          {
            "id": "choice-3",
            "text": "Use you're welcome as a request."
          }
        ],
        "answerId": "choice-2",
        "feedback": "Takk fits this request; it is not a universal translation of please."
      }
    },
    {
      "id": "tip-english",
      "title": "Switching to English is fine",
      "severity": "good-to-know",
      "category": "Phrases in context",
      "body": "Try a greeting, then ask talarðu ensku? If the person switches to English, continue in English. Getting understood matters more than finishing a memorized script.",
      "why": "Do not make a busy person a language tutor.",
      "linkedItem": "p13",
      "sourceIds": [
        "language-course"
      ],
      "reviewedBy": null,
      "question": {
        "prompt": "The server replies in English. What next?",
        "options": [
          {
            "id": "choice-1",
            "text": "Insist on an Icelandic lesson."
          },
          {
            "id": "choice-2",
            "text": "Pretend you understood everything."
          },
          {
            "id": "choice-3",
            "text": "Continue in English and thank them."
          }
        ],
        "answerId": "choice-3",
        "feedback": "A language switch can make the interaction easier for both of you."
      }
    },
