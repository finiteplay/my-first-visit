          "id": "weather",
          "title": "Icelandic weather changes the way a day feels",
          "evidenceLabel": "Travelers repeatedly mention",
          "body": [
            "Iceland may not look extremely cold on a weather app, but the temperature number leaves out the part travelers notice most: strong wind, cold rain and repeated changes during the same day. A calm morning in Reykjavík can become a wet and exposed afternoon on the coast. Waterfall spray adds another source of water even when the sky is clear.",
            "Travelers from snowy US states, tropical climates and northern Europe describe the same adjustment. A Hawaii-based traveler who spent a month circling the country sometimes met fog and rain that reduced visibility to a few meters, yet also enjoyed many pleasantly chilly periods. Another first-timer discovered that water-resistant pants soaked through while a companion's truly waterproof pair held. Bad weather is not constant; the practical problem is that the useful outfit can change within an hour.",
            "The all-season foundation is a windproof waterproof jacket, waterproof pants, waterproof footwear, a non-cotton base layer and a fleece or wool mid-layer. Then adjust the amount of insulation: summer needs lighter layers and an eye mask; spring and autumn need thermal layers ready for sudden cold, mud or sleet; winter needs warm base layers top and bottom, heavier insulation, a warm waterproof outer layer, and warmer gloves, hat and neck protection. In every season, one dry layer should stay easy to reach rather than buried under luggage.",
            "Check the Icelandic Met Office and road conditions every morning and again before a meaningful route change. Dress for the exposed stop or hike, not only for the walk from a Reykjavík restaurant to the hotel. If an official warning says to delay the drive, a saved itinerary is not a reason to continue."
          ],
