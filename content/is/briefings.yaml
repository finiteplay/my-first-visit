          "id": "language",
          "title": "English will carry the trip; Icelandic changes the tone",
          "evidenceLabel": "Our take",
          "body": [
            "Visitor-facing Iceland works readily in English. You do not need to turn the flight into language school. Learn a greeting, thanks, excuse me, the shapes of a few signs and the emergency number. Use Icelandic once, accept an English reply without making a busy person teach, and keep the complete phrase cards for the situations where showing the screen is easier than improvising.",
            "The language toolkit is always available. If you would enjoy a few minutes of practice, start with greetings; the lesson stays separate from the guide and never blocks the travel advice."
