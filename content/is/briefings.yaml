        {
          "id": "cost",
          "title": "Plan the expensive parts and enjoy the rest",
          "evidenceLabel": "Our take",
          "body": [
            "Iceland is expensive, but the cost is easier to accept when you decide what the trip is for. Recent travelers repeatedly spend the largest amounts on lodging, transport, rental coverage, booked activities and restaurant meals. Parking and convenience purchases then add a steady stream of smaller charges.",
            "The useful approach is not to make every day cheap. One solo traveler deliberately visited several premium lagoons and felt the five-day trip was worth the money. A Nashville couple packed simple lunches so they could keep the geology, art and meals they cared about. Camper travelers combined transport, lodging and a kitchen in one expensive item, then saved elsewhere.",
            "Before booking, estimate the whole trip: vehicle or tours, coverage, lodging, fuel, parking, activities and a believable mixture of groceries and restaurants. Choose two or three experiences you want to enjoy without doing currency conversion at the door. Grocery breakfasts, road lunches, tap water and neighborhood pools can protect those choices without turning the vacation into a deprivation contest."
