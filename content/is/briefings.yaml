        {
          "id": "choose-season",
          "title": "Choose the month for the trip you actually want",
          "evidenceLabel": "Our take, based on official seasonal guidance and traveler reports",
          "body": [
            "There is no month when Iceland becomes a bad destination for everyone, but there are bad matches between a month and a plan. For a first visit built around a broad self-drive, long outdoor days and the fewest seasonal complications, June through August are the easiest months. They bring very long daylight and the widest access, but also the highest demand: lodging, cars, campervans and tours can cost more or sell out, famous stops are busier, and the bright nights are poor for aurora hunting.",
            "For that broad first-time road trip, November is usually the weakest compromise. Daylight has become short, autumn rain and wind can turn wintry, and many summer-only routes or services are no longer part of the plan. Yet it does not consistently deliver the settled snow-covered winter people imagine. Recent travelers describe both storm disruption and wonderful November trips, so this is a fit warning, not a promise of bad weather.",
            "December through February are the most demanding months overall. Short daylight, ice, snow, wind and temporary closures can shrink a self-drive itinerary quickly. Choose them because you want a winter trip: Reykjavík, pools, guided outings, ice or snow experiences and a chance—not a guarantee—of aurora. They are a poor fit if your non-negotiables are a fast Ring Road, Highlands access, long hikes or seeing everything in one visit.",
            "May and September are often appealing compromises: useful daylight, somewhat lower demand and a mixture of seasons. The bargain is uncertainty. Early May can retain winter conditions in the north or at elevation; September can turn wintry earlier than expected. October and March or April can be rewarding for a smaller flexible route, but they deserve winter-capable plans rather than a summer itinerary with a warmer coat.",
            "The simplest recommendation for a first-time US traveler is June or early September if access and manageable planning matter most. Choose late autumn or winter deliberately for winter atmosphere and dark skies, preferably with a smaller map and guided alternatives. Avoid selecting November merely because it looks like a cheaper version of summer."
          ],
          "doBeforeDeparture": [
            "Write down the two experiences that make the trip worthwhile, then reject months when those experiences are normally unavailable.",
            "If choosing November through March, build the itinerary with a shorter winter geography and at least one movable day.",
            "If choosing June through August, reserve scarce lodging, vehicles and tours earlier and bring an eye mask.",
            "Treat aurora, puffins, Highlands access and a full Ring Road as different seasonal goals; no month optimizes all four."
          ],
