    {
      "id": "spend-on-purpose",
      "title": "Planning an Iceland budget without cutting out the fun",
      "fits": [
        "budget",
        "comfort"
      ],
      "readingMinutes": 6,
      "evidenceLabel": "Our take, with traveler examples",
      "body": [
        "Travelers describe the same surprise from different angles. A four-day visitor from the Washington, D.C. area found food noticeably costlier than at home. An Australian on a small-group tour called the country exceptionally expensive. A couple on a Reykjavík waterfront day found harbor dining pricey. None of them claim the trip was a bad value. The complaint is about surprise, not about whether the country is worth it.",
        "A useful way to plan is to start with the two or three experiences you actually came for and pay for them on purpose. One solo winter traveler itemized a five-day trip and found that premium lagoons, food, parking and activities together cost more than lodging, and still called it worth it, because the spending matched the reason for going. A couple who published an itemized road-trip budget concluded that accommodation and comfort choices moved the total far more than small grocery savings did. Decide the splurges first, then protect them.",
        "Next price the full trip, not the headline. Add transport (a rental car or tours, plus coverage and fuel), lodging, parking, booked activities, and a realistic mix of restaurant and self-catered food. A Canadian couple whose camper combined vehicle, bed and kitchen kept costs down further by bringing groceries from home. A US couple's short late-October trip with guesthouses came to a total near $3,600, which is an example of how party size and comfort set the figure, not a target. Another traveler's report noted that parking is paid in different ways in different places, so a small cost can also be a small hassle.",
        "The cheap wins are simple and do not make the trip feel cheap. Tap water is free and good. Grocery stores let you build breakfast and road lunches; operator guides say Bónus is the cheapest chain, Krónan offers more variety and later hours, and Nettó sits between them, with some branches open around the clock. A Nashville couple packed lunches on a stopover to save for the meals they wanted, and one traveler found connectivity inexpensive. A neighborhood pool costs a fraction of a lagoon. Tipping is not expected because service is included, and Iceland is largely cashless, so you rarely need to carry cash.",
        "Be wary of two traps. The first is copying someone else's total, because currency, party size, season, vehicle and cancellation flexibility all differ. The second is cutting so hard that you lose the experiences that justify the flight, such as a guided glacier activity, a lagoon evening or one memorable meal. Plan the number you can afford, include a cushion for the small stuff, and spend freely where it matters to you."
