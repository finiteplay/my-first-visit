    {
      "id": "pack-for-exposure",
      "title": "What Iceland's changing weather feels like, and what to pack",
      "fits": [
        "all-seasons"
      ],
      "readingMinutes": 3,
      "evidenceLabel": "Travelers repeatedly mention",
      "cardImage": {
        "src": "assets/clothing-rental.webp",
        "alt": "A traveler compares a waterproof jacket and an Icelandic wool sweater in an outdoor clothing shop."
      },
      "body": [
        "Icelandic weather is special because several ordinary conditions can arrive together. A temperature that looks mild can feel much colder in strong wind. A shower may last long enough to soak ordinary pants, then give way to sunshine before the next stop. Near waterfalls, spray can wet you even on a bright day.",
        "Pack so that you can adjust rather than depend on one heavy coat. Start with a genuinely windproof waterproof jacket and waterproof pants. Add waterproof footwear, thin warm layers, a hat and gloves. Summer needs lighter insulation than winter, but it still needs protection from wind and water.",
        "Keep a spare dry layer where you can reach it without unpacking the car. Check the official forecast each morning, and treat weather warnings as a reason to change the plan rather than a challenge to overcome.",
        "You do not have to buy an entire cold-weather wardrobe for one trip. Outdoor-clothing rental is available in Reykjavík, including waterproof jackets and pants, hiking boots, hats and gloves. Rental can make sense for a short stopover, an unusual size of winter layer or equipment you are unlikely to use at home. Reserve the exact sizes in advance and check pickup, delivery, return, deposit and damage terms; a Reykjavík return can be awkward before an early Keflavík flight.",
        "Iceland also has excellent technical clothing and genuine Icelandic wool garments. A well-made lopapeysa can be warm, durable and a meaningful purchase, but do not assume every Nordic-looking sweater is hand-knitted in Iceland: 'designed in Iceland' may describe an imported product. If your main goal is simply to arrive warm and dry, you can often save considerably by buying comparable base layers, fleece and waterproof shells before the trip, where you have time to compare prices, wait for a sale and test the fit. Buy Icelandic clothing because you value the material, craft or design—not because you postponed essential rain gear until the first storm."
      ],
      "options": [
        {
          "name": "June through August",
          "bestFor": "Use a light wool or synthetic base when needed, a fleece or light insulated mid-layer and a windproof waterproof shell. Carry rain pants, waterproof footwear, warm socks, a light hat and gloves even when the morning is sunny. Add sunglasses, sunscreen and an eye mask for the long bright nights.",
          "tradeoff": "This is the lightest clothing load, not shorts-only weather. Exposed coasts, waterfalls, boats and high ground can still feel cold and wet."
        },
        {
          "name": "May and September–October",
          "bestFor": "Keep the full waterproof shell and add thermal base layers, a warmer fleece or light down layer, warm hat, wind-resistant gloves and a neck gaiter. Waterproof boots with useful tread matter when paths are muddy, slushy or icy.",
          "tradeoff": "Shoulder season can behave like summer or winter during the same trip. Pack components you can combine rather than one coat expected to solve everything."
        },
        {
          "name": "November through April",
          "bestFor": "Bring thermal base layers for top and legs, a substantial fleece or wool mid-layer, heavier insulation, a windproof waterproof winter shell or parka, waterproof outer pants, insulated waterproof boots, warm socks, warm gloves or mittens, hat and neck protection.",
          "tradeoff": "City clothing is not enough for an exposed stop. Keep spare dry gloves and socks accessible; activity providers may require or supply additional equipment."
