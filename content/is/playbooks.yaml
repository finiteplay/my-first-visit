      "travelerStories": [
        "A Boston couple on a twelve-day campervan circuit loved not committing to lodging, but also had a dead battery, slow gravel access and depended on another motorhome's jumper cables.",
        "A couple in a compact campervan for eight nights in early March relied on an all-night heater, valued changing direction after a wind cancellation, and itemized camping, fuel and van costs instead of treating the van as free lodging.",
        "A couple in a larger four-seat camper valued enough room to leave the bed assembled and shelter from the wind. They contrasted it with smaller vans that need daily bed and seat conversion, and they advised level parking and parking into the wind."
