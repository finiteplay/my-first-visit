    {
      "id": "rental-counter-before-counter",
      "title": "Rental car insurance: decide before you collect the keys",
      "fits": [
        "self-drive"
      ],
      "readingMinutes": 9,
      "evidenceLabel": "Experiences vary",
      "hook": "The rental counter can introduce several Iceland-specific choices just when you are tired and ready to leave the airport.",
      "cardImage": {
        "src": "assets/wind-car-door.webp",
        "alt": "A traveler holds a car door securely with both hands at a designated pullout in strong wind."
      },
      "body": [
        "When you collect a rental car in Iceland, you may be asked about more than the familiar collision waiver. Depending on the company and vehicle, the choices can separately mention gravel, wind-blown doors, sand and ash, glass, tires, underbody damage, water damage, towing or a lower deductible. The names and combinations vary, which is why the phrase full coverage is not enough by itself.",
        "These questions matter because the driving environment is unusual. Loose stones can strike a windshield even on a paved road. Strong wind can pull a door beyond its normal travel in one sudden movement. Sand or ash can damage a vehicle during particular conditions. Rental providers treat these as distinct risks, and traveler forums contain repeated reports of both damage and uneventful trips. That repetition shows that the decision deserves attention; it does not tell us the statistical chance that your car will be damaged.",
        "If your first priority is the simplest return and the least uncertainty, the easiest path is usually to buy the rental company's broadest suitable package after reading what it still excludes. Travelers often describe this as paying for peace of mind. It may cost more, but a covered incident can be handled inside the rental company's own process instead of requiring you to pay first and request reimbursement from another company.",
        "If you are willing to spend time before departure, your credit card may be a reasonable alternative. Call the benefit administrator for the exact card, describe Iceland, the vehicle, the rental length and the damage types by name, then ask for the current answer in writing. Also ask whether you must decline the rental company's CDW or LDW, whether unavoidable included coverage changes the card benefit, how much you might have to pay first, which documents a claim requires and how long reimbursement can take.",
        "Traveler experiences explain why a phone call alone is not a guarantee. One recent Chase Sapphire Reserve cardholder said the benefit line confirmed ash, sand and wind damage and issued a coverage letter before the trip, but that traveler did not report a claim. Another traveler said Chase eventually paid a roughly $900 rock-dent claim only after months of calls and appeals. An older Sapphire Reserve traveler reported that a $3,300 wind-door claim was reimbursed after they paid first and waited six to eight weeks. The differences may involve the card, the benefit version, the rental agreement, how the incident happened and the required paperwork.",
        "If you decide to accept more of the risk yourself, make it a deliberate financial decision rather than an assumption that careful driving removes every hazard. Know the maximum amount the rental company may charge, keep enough card capacity for a deposit or repair charge, photograph the vehicle carefully and save the agreement and assistance number offline."
      ],
      "travelerStories": [
        "An autumn South Coast driver reported a large stone strike on a paved road. Their broad rental waiver turned visible windshield damage into relief rather than an end-of-trip argument.",
        "A ten-day summer driver heard stones hit the car and encountered strong wind but returned it without a claim. The broad coverage bought peace of mind; it did not prove damage was inevitable.",
        "A Chase Sapphire Reserve traveler reported reimbursement for older wind-door damage, but only after paying $3,300 first and waiting six to eight weeks. Current benefits and another incident may be treated differently."
      ],
      "decision": {
        "easiestPath": "Buy the rental company's broadest suitable coverage. It usually costs more but keeps a covered incident inside one company's process. Read the exclusions and deductible before assuming it means zero liability.",
        "researchPath": "Ask the exact card's benefit administrator for written terms. This may avoid duplicate spending, but it can require declining a waiver, paying the rental company first and pursuing reimbursement with extensive documentation.",
        "acceptMoreRiskPath": "Decline optional protection only after you understand the contract's maximum exposure and can carry that charge. Careful habits reduce avoidable risk but do not make glass, weather or another driver's actions disappear."
      },
      "checklist": [
        "Ask the card benefit administrator for written confirmation for Iceland, the exact vehicle and rental length.",
        "Compare glass/gravel, wind-blown doors, sand/ash, tires, underbody, water, towing and loss-of-use—not just the phrase full coverage.",
        "Record each deductible and whether you must pay first.",
        "Confirm which roads the vehicle may use. A 4x4 badge does not authorize an F-road.",
        "Photograph the vehicle at pickup and return under good light.",
        "Before opening a door, look at flags, grass and other clues to wind direction. Park the front of the car into strong wind when it is safe and practical.",
        "Tell every passenger about the door risk before the first stop. Open one door at a time and keep a firm two-handed hold in strong wind. These are precautions, not guarantees."
      ],
      "liveChecks": [
