    {
      "id": "drive-without-performing",
      "title": "Taking photos safely on Iceland's roads",
      "fits": [
        "self-drive",
        "camper"
      ],
      "readingMinutes": 6,
      "evidenceLabel": "Officially + traveler experience + our take",
      "hook": "Iceland is remarkably picturesque, but many roads have narrow shoulders or no safe place to stop.",
      "cardImage": {
        "src": "assets/iceland-road-weather.webp",
        "alt": "An empty Icelandic coastal road crosses moss-covered volcanic land beneath changing clouds."
      },
      "body": [
        "You will see places that make everyone in the car reach for a camera. The safe response is not always to stop immediately. On many rural roads there is little or no shoulder, and a stopped vehicle near a curve or a rise can leave the next driver without enough time to react. The national safety service's guidance is blunt: park only at designated places, and do not stand in or step onto the road to take a picture.",
        "The tempting moment is also the dangerous one. A traveler describes the Reykjavík-to-Jökulsárlón drive as a highlight, yet found that being the driver limited the view and that one-lane bridges demanded attention. A Colorado winter driver who based in Reykjavík and chose day trips by weather found the roads manageable but the roundabout priority unfamiliar. In both cases the concern is the same: attention that goes to scenery is attention not on the road.",
        "Keep driving until you reach a designated pullout, car park or another place where the whole vehicle can leave the travel lane and remain visible. If you miss the photograph, let it go. The landscape continues, and no image is worth a collision. Dividing the work helps: the passenger handles photos and navigation while the driver drives, and you switch at the next safe stop.",
        "Animals are part of the road. Sheep are common beside Icelandic roads, and Icelandic horses graze in pastures along many of them. The horse is a point of national pride, and Icelanders generally prefer \"horse\" to \"pony\" even though the breed is small. Slow down near animals and enjoy them from the car or from a designated pullout, never from a stopped car on the road.",
        "Conditions matter as much as geometry. A winter driver set a pre-trip rule to turn around if conditions exceeded their comfort, and a repeat renter sometimes left the car parked in bad weather and once ended a camper trip early when wind made continued driving unsafe. Route 1 is paved, but surfaces can change quickly. The official overview separates paved roads, gravel roads and F-roads, directs travelers to current road and weather checks, and warns against off-road driving. F-roads are a separate highland decision that needs an authorized vehicle and a current conditions check; a first trip can be excellent without them.",
        "At night the stakes rise, because a parked car is nearly invisible. The same safety guidance for aurora watchers applies to any evening stop: use a designated lot, carry a headlamp, dress in layers and check the weather and road conditions before leaving. For any emergency, call 112, and save current alternative contact guidance before you set out."
      ],
      "checklist": [
        "Passenger handles photos and navigation; driver drives.",
        "Check road and weather conditions before departure and at meaningful route changes.",
        "Do not stop on the roadway, a shoulderless rise or a curve.",
        "Turn around before conditions exceed the least-confident driver's limit.",
        "Slow down before pavement becomes gravel, and give sheep and other vehicles room.",
        "Never drive off-road or make your own track; F-roads need an authorized vehicle and a current check.",
        "Call 112 for an emergency; save current alternative contact guidance from 112 and SafeTravel."
      ],
      "sourceIds": [
        "r002",
        "r004",
        "t010",
        "k004",
        "o001",
        "o002",
        "o005",
        "o006",
        "o014",
        "p012",
        "e004"
      ],
      "decision": {
        "easiestPath": "Assign roles before you start: one person drives, the other navigates and photographs. Stop only at designated pullouts and car parks, and accept the shots you miss.",
        "researchPath": "Mark scenic stops on an offline map before the day. Use the road and weather services each morning, and plan a route with enough designated stops that you rarely feel pressure to stop on the roadway.",
        "acceptMoreRiskPath": "Treat stopping outside a designated place as the option to avoid; every source here says to use designated places. If a breakdown or hazard forces a stop, get the vehicle fully clear of the lane and call 112 if anyone is at risk."
      },
