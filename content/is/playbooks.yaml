      "warning": "Camping and parking rules, campsite openings and vehicle terms can change. Verify the current rule and each overnight stop; do not assume that an empty parking area permits sleeping in the vehicle.",
      "limits": "Traveler accounts establish recurring trade-offs, not campervan market share or a universal cost advantage. Comfort depends strongly on vehicle layout, party size, season and prior camping experience.",
