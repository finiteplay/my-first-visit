      "english": "Iceland",
      "local": "Ísland",
      "respelling": "EES-lahnd",
      "meaning": "\"Ice land\" in Icelandic.",
      "story": "The saga tradition says a Norse explorer nicknamed Raven-Flóki (Hrafna-Flóki) wintered here, lost his livestock to a hard winter and gave the island the name Ísland, which stuck.",
      "sourceIds": ["e005"]
    },
    {
      "english": "Reykjavík",
      "local": "Reykjavík",
      "respelling": "RAYK-yah-veek",
      "meaning": "Often translated \"Smoky Bay\".",
      "story": "By tradition the first permanent settler, Ingólfur Arnarson, settled here in 874 and named the bay for the steam rising from hot springs. The final syllable sounds like the English word \"week\", not \"vick\".",
      "sourceIds": ["e005"]
    }
  ],
  "pronunciationNote": "These respellings are drafts written for an American reader and have not had native-speaker review. The audio is a synthetic draft voice.",
  "numbers": [
    {"label": "People", "value": "about 394,000", "detail": "Statistics Iceland counted 394,324 on 1 January 2026. About two thirds live in the capital area.", "sourceIds": ["o019"]},
    {"label": "Size", "value": "about 103,600 km²", "detail": "Roughly the size of the US state of Kentucky, but with the population of a mid-size city.", "sourceIds": ["o019"]},
    {"label": "Reykjavík", "value": "about 140,000", "detail": "In the city itself; about 250,000 across the wider capital area.", "sourceIds": ["o019"]},
    {"label": "Horses", "value": "roughly 80,000-90,000", "detail": "Sources count differently, so treat it as a range. All belong to one breed.", "sourceIds": ["e004", "p012"]},
    {"label": "Sheep", "value": "about half a million", "detail": "Around 476,000 were registered with the food and veterinary authority; many roam freely in summer, so watch the road.", "sourceIds": ["e004"]},
    {"label": "Emergency", "value": "112", "detail": "The single emergency number for police, ambulance and rescue. Save it before you drive.", "sourceIds": ["o006"]}
