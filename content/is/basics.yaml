    "visit": "You can see the ice-capped mountain from the Ring Road in South Iceland. A family-run visitor centre, Eyjafjallajökull Erupts, sits right on Route 1 at the Þorvaldseyri farm, about 140 km east of Reykjavík, with photos, exhibits and a short documentary. Check opening hours before you go.",
