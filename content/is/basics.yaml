  "tips": [
    {
      "title": "The wind is the real weather story",
      "text": "What most places call a strong wind is ordinary here, and it can make a mild day feel cold. Travelers also report car doors being ripped from hands, which is why rental-car coverage questions come up at the counter. Park nose into the wind, hold the door with both hands, and let the first person out help the others.",
      "label": "Traveler pattern",
      "links": [{"label": "What the weather feels like and what to pack", "open": "playbook:pack-for-exposure"}, {"label": "Rental car insurance", "open": "playbook:rental-counter-before-counter"}],
      "sourceIds": ["r001", "t001", "o012"]
    },
    {
      "title": "Gravel is normal; F-roads are a separate decision",
      "text": "Expect gravel stretches even on main routes. F-roads are rough highland tracks that need an authorized vehicle and a current conditions check, and a first trip has plenty to see without them. Check the rental agreement before assuming a 4x4 badge covers them.",
      "label": "Official guidance",
      "links": [{"label": "Photos, stopping and road safety", "open": "playbook:drive-without-performing"}],
      "sourceIds": ["o001", "o002"]
    },
    {
      "title": "Do not stop in the road for a photo",
      "text": "There are few places to pull over, and a stopped car on a curve is a real danger. Slow down and use a designated pullout, even if it means missing the shot.",
      "label": "Official guidance",
      "links": [{"label": "Photos, stopping and road safety", "open": "playbook:drive-without-performing"}],
      "sourceIds": ["o014"]
    },
    {
      "title": "Budget for the trip, not just the headline",
      "text": "Rental cars, fuel, lodging and food all cost more than many visitors expect. Groceries, tap water and a neighborhood pool help without making the trip feel cheap.",
      "label": "Our take",
      "links": [{"label": "Planning a budget", "open": "playbook:spend-on-purpose"}],
      "sourceIds": ["r005", "b003", "p010"]
    },
    {
      "title": "Cards everywhere, tipping not expected",
      "text": "Iceland is largely cashless and service is included in prices. Check that your card does not add heavy foreign-transaction fees.",
      "label": "Official guidance + our take",
      "links": [],
      "sourceIds": ["o015"]
    },
    {
      "title": "Hot water is a national habit",
      "text": "Public pools and lagoons are a highlight and a different experience from each other. At pools you shower thoroughly without a swimsuit first. Some lagoons need a reservation.",
      "label": "Official guidance + traveler pattern",
      "links": [{"label": "Pool or lagoon", "open": "playbook:pool-or-lagoon"}],
      "sourceIds": ["o007", "r006", "r008"]
    },
    {
      "title": "A little Icelandic goes a long way",
      "text": "Travelers report getting by in English, and a few polite words are still welcome. Place names are easier with one pattern: foss means waterfall, and you will meet it everywhere (Gullfoss, Skógafoss).",
      "label": "Our take",
      "links": [],
      "sourceIds": ["k005"]
    },
    {
      "title": "Parking in Reykjavík is zoned",
      "text": "Downtown has four paid zones, P1 to P4, and the closer to the center, the higher the fee. You can pay at a meter or in the Parka or EasyPark apps; set up payment before you need it and read the sign for hours, because some zones charge on Sundays.",
      "label": "Official guidance",
      "links": [],
      "sourceIds": ["o020"]
    },
    {
      "title": "Reykjavík is worth a purposeful day",
      "text": "Perlan, the whale and aurora museums and the harbor area make an easy day, and the two main walking streets have shops, cafes and small squares.",
      "label": "Our take",
      "links": [{"label": "How much time to spend in Reykjavík", "open": "playbook:reykjavik-purpose"}],
      "sourceIds": ["k001", "t004", "o016"]
    },
    {
      "title": "Aurora is hard to plan around",
      "text": "It needs darkness, activity and a clear sky, and no forecast can promise it. Keep a few evenings open and check the cloud map, not just the activity number.",
      "label": "Official guidance + traveler pattern",
      "links": [{"label": "Northern lights without the regret", "open": "playbook:aurora-without-regret"}],
      "sourceIds": ["o004", "r011", "r015"]
    },
    {
      "title": "Horses, not ponies",
      "text": "Icelanders are proud of their horse and many dislike the word pony, even though the animals are small.",
      "label": "Traveler pattern",
      "links": [],
      "sourceIds": ["p012"]
    }
  ],
